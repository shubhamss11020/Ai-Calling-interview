services:
  # Neon (Postgres) and Upstash (Redis) are hosted: nothing database-related runs locally.
  # All settings come from backend/.env.
  api:
    build:
      context: ./backend
    container_name: recruitment_api
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      - ASYNC_PROCESSING=true
    volumes:
      - ./backend/uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker_resume:
    build:
      context: ./backend
    container_name: recruitment_worker_resume
    env_file: ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info -Q resume-parsing --concurrency=4

  worker_screening:
    build:
      context: ./backend
    container_name: recruitment_worker_screening
    env_file: ./backend/.env
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info -Q screening --concurrency=16 --pool=threads

  worker_telephony:
    build:
      context: ./backend
    container_name: recruitment_worker_telephony
    env_file: ./backend/.env
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info -Q telephony --concurrency=32 --pool=threads
